apiVersion: 1
contactPoints:
  - orgId: 1
    name: agents-webhook
    receivers:
      - uid: agents-webhook
        type: webhook
        settings:
          url: http://agents:8090/grafana-webhook   # -> ops.incident (+ optional auto-triage)
          httpMethod: POST
policies:
  - orgId: 1
    receiver: agents-webhook
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
