[project]
name = "lakehouse"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pyiceberg[pyarrow]==0.12.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "psycopg[binary]==3.3.5",
  "requests==2.34.2",
  "tenacity==9.1.4",
  "yfinance==1.8.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "pyspark==4.0.5", "websockets==16.1.1", "confluent-kafka==2.15.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests/unit"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["dbt/dbt_packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Runs on the Spark image's Python 3.10: keep timezone.utc (no datetime.UTC).
"spark_jobs/stream_market.py" = ["UP017"]
